<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor | Blog Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="dashboard.html">Blog Admin</a>
        <button id="logout" type="button">Log out</button>
    </header>
    <main>
        <h1 id="heading">New post</h1>
        <p id="status" hidden></p>

        <form id="post-form">
            <label>Title <input name="title" required maxlength="200"></label>
            <label>Content <textarea name="content" rows="16" required></textarea></label>
            <label class="check">
                <input name="published" type="checkbox"> Published
            </label>
            <div>
                <button type="submit">Save</button>
                <a href="dashboard.html">Cancel</a>
            </div>
            <p class="error" id="error" role="alert"></p>
        </form>
    </main>
    <script type="module" src="js/editor.js"></script>
</body>
</html>
